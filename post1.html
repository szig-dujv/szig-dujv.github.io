<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bejegyzés | Dunaújvárosi Széchenyi István Gimnázium</title>
    
    <!-- Alapértelmezett Open Graph meták (átírja a JS, ha van poszt) -->
    <meta property="og:title" content="Bejegyzés | Dunaújvárosi Széchenyi István Gimnázium">
    <meta property="og:description" content="Olvassa el a legfrissebb híreinket és bejegyzéseinket.">
    <meta property="og:image" content="https://ujvaros.github.io/szig/res/szig-share-logo.jpg">
    <link rel="icon" type="image/png" href="/szig/res/favicon/favicon-16.png" sizes="16x16" />
    <link rel="icon" type="image/png" href="/szig/res/favicon/favicon-32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="/szig/res/favicon/favicon-192.png" sizes="192x192" />
	<link rel="icon" type="image/svg+xml" href="/szig/res/logo/SzIG.svg" />
	<link rel="shortcut icon" href="/szig/res/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/szig/res/favicon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Dunaújvárosi Széchenyi István Gimnázium" />
    
    <link rel="stylesheet" href="/szig/res/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <script src="/szig/res/HeaderFooter.js"></script>
    <my-header></my-header>

    <div id="news-container" class="post-grid">
        <div class="container" id="post-container">
            <div class="loading">⏳ Bejegyzés betöltése...</div>
        </div>
    </div>

    <script src="/szig/res/nav-menu-button.js"></script>
    <script src="/szig/res/theme-toggle.js"></script>

    <script>
        // Segédfüggvények
        function decodeHtmlEntities(str) {
            const textarea = document.createElement('textarea');
            textarea.innerHTML = str;
            return textarea.value;
        }
        function escapeHtml(str) {
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        // Frissíti az Open Graph metákat a poszt adataival
        function updateOpenGraph(post) {
            // Title
            let title = decodeHtmlEntities(post.title.rendered).trim();
            if (!title) title = 'Bejegyzés';
            setMetaContent('og:title', title);
            document.title = `${title} | Széchenyi Gimnázium`;

            // Description (excerpt vagy a content első 160 karaktere)
            let description = '';
            if (post.excerpt && post.excerpt.rendered) {
                description = decodeHtmlEntities(post.excerpt.rendered).replace(/<[^>]*>/g, '');
            } else {
                description = decodeHtmlEntities(post.content.rendered).replace(/<[^>]*>/g, '').substring(0, 160);
            }
            setMetaContent('og:description', description);
            setMetaContent('description', description); // normál description is

            // Image (featured media)
            let imageUrl = 'https://ujvaros.github.io/szig/res/szig-share-logo.jpg';
            if (post._embedded && post._embedded['wp:featuredmedia'] && post._embedded['wp:featuredmedia'][0]) {
                imageUrl = post._embedded['wp:featuredmedia'][0].source_url;
            }
            setMetaContent('og:image', imageUrl);
        }

        // Segédfüggvény meta tartalom beállítására
        function setMetaContent(propertyOrName, content) {
            // Először megpróbáljuk property szerint (og:)
            let meta = document.querySelector(`meta[property="${propertyOrName}"]`);
            if (!meta) {
                // Ha nincs, próbáljuk name szerint (pl. description)
                meta = document.querySelector(`meta[name="${propertyOrName}"]`);
            }
            if (meta) {
                meta.setAttribute('content', content);
            } else {
                // Ha még mindig nincs, létrehozzuk
                meta = document.createElement('meta');
                if (propertyOrName.startsWith('og:')) {
                    meta.setAttribute('property', propertyOrName);
                } else {
                    meta.setAttribute('name', propertyOrName);
                }
                meta.setAttribute('content', content);
                document.head.appendChild(meta);
            }
        }

        async function loadPost() {
            const urlParams = new URLSearchParams(window.location.search);
            const postId = urlParams.get('id');

            if (!postId) {
                document.getElementById('post-container').innerHTML = '<div class="error">❌ Érvénytelen vagy hiányzó bejegyzés azonosító.</div>';
                return;
            }

            const container = document.getElementById('post-container');
            container.innerHTML = '<div class="loading">⏳ Bejegyzés betöltése...</div>';

            try {
                // Lekérjük a posztot a featured image-dzsel együtt
                const response = await fetch(`https://szig-dujv.hu/wp-json/wp/v2/posts/${postId}?_embed`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const post = await response.json();

                // Frissítjük az Open Graph metákat (ez már a betöltés után azonnal megtörténik)
                updateOpenGraph(post);

                // Feldolgozzuk a megjelenítéshez
                let title = decodeHtmlEntities(post.title.rendered).trim();
                if (title === '') title = '(Cím nélküli bejegyzés)';
                let content = post.content.rendered;
                let date = new Date(post.date);
                let formattedDate = date.toLocaleDateString('hu-HU', { year: 'numeric', month: 'long', day: 'numeric' });

                container.innerHTML = `
                    <a href="/szig" class="back-link">← Vissza a hírekhez</a>
                    <div class="post-header">
                        <h1 class="post-title">${escapeHtml(title)}</h1>
                        <span class="post-meta">📅 Közzétéve: ${formattedDate}</span>
                    </div>
                    <div class="post-content">
                        ${content}
                    </div>
                `;
            } catch (error) {
                console.error('Hiba a betöltéskor:', error);
                container.innerHTML = `<div class="error">❌ Hiba történt a bejegyzés betöltésekor: ${error.message}</div>`;
            }
        }

        loadPost();
    </script>

    <my-footer></my-footer>
</body>
</html>
