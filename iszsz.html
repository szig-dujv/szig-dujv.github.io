<body>
  <script src="/szig/res/HeaderFooter.js"></script>
	<my-header></my-header>
<div id="news-container" class="post-grid">
<div class="container" id="post-container">
    <div class="loading">⏳ Oldal betöltése...</div>
</div>
</div>
<script src="/szig/res/nav-menu-button.js"></script>
<script src="/szig/res/theme-toggle.js"></script>

<script>
    const FIXED_PAGE_ID = 79;  // 👈 Cseréld ki a kívánt ID-ra!

    function decodeHtmlEntities(str) {
        const textarea = document.createElement('textarea');
        textarea.innerHTML = str;
        return textarea.value;
    }

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    async function loadPage() {
        // KIZÁRÓLAG a fix ID-t használjuk, a URL paramétereket figyelmen kívül hagyjuk
        const pageId = FIXED_PAGE_ID;

        if (!pageId) {
            document.getElementById('post-container').innerHTML = '<div class="error">❌ Érvénytelen vagy hiányzó oldal azonosító.</div>';
            return;
        }

        const container = document.getElementById('post-container');
        container.innerHTML = '<div class="loading">⏳ Oldal betöltése...</div>';

        try {
            const url = `https://szig-dujv.hu/wp-json/wp/v2/pages/${pageId}`;
            const response = await fetch(url);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);

            const page = await response.json();

            let title = decodeHtmlEntities(page.title.rendered).trim();
            if (title === '') title = '(Cím nélküli oldal)';

            let content = page.content.rendered;
            content = decodeHtmlEntities(content);

            let date = new Date(page.date);
            let formattedDate = date.toLocaleDateString('hu-HU', { year: 'numeric', month: 'long', day: 'numeric' });

            container.innerHTML = `
                <div class="post-header">
                    <h1 class="post-title">${escapeHtml(title)}</h1>
                    <span class="post-meta">📅 Utolsó frissítés: ${formattedDate}</span>
                </div>
                <div class="post-content">
                    ${content}
                </div>
            `;
        } catch (error) {
            console.error('Hiba:', error);
            container.innerHTML = `<div class="error">❌ Hiba történt: ${error.message}</div>`;
        }
    }

    loadPage();
</script>
  <my-footer></my-footer>
</body>
</html>
