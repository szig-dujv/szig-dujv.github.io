<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta property="og:title" content="Oldal | Dunaújvárosi Széchenyi István Gimnázium">
    <meta property="og:description" content="Olvassa el a legfrissebb híreinket és bejegyzéseinket.">
    <meta property="og:image" content="https://szig-dujv.github.io/res/szig-share-logo.jpg">
    <link rel="icon" type="image/png" href="/res/favicon/favicon-16.png" sizes="16x16" />
    <link rel="icon" type="image/png" href="/res/favicon/favicon-32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="/res/favicon/favicon-192.png" sizes="192x192" />
	<link rel="icon" type="image/svg+xml" href="/res/logo/SzIG.svg" />
	<link rel="shortcut icon" href="/res/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/res/favicon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Dunaújvárosi Széchenyi István Gimnázium" />
	<link rel="stylesheet" href="/res/styles.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
	<script src="/res/HeaderFooter.js"></script>
	<my-header></my-header>
<div id="news-container" class="post-grid">
<div class="container" id="post-container">
    <div class="loading">⏳ Bejegyzés betöltése...</div>
</div>
</div>
<script src="/res/nav-menu-button.js"></script>
<script src="/res/theme-toggle.js"></script>
	
<script>
    // Segédfüggvények (decode, escape)
    function decodeHtmlEntities(str) {
        const textarea = document.createElement('textarea');
        textarea.innerHTML = str;
        return textarea.value;
    }
    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    async function loadPost() {
        const urlParams = new URLSearchParams(window.location.search);
        const postId = urlParams.get('id');

        if (!postId) {
            document.getElementById('post-container').innerHTML = '<div class="error">❌ Érvénytelen vagy hiányzó bejegyzés azonosító.</div>';
            return;
        }

        const container = document.getElementById('post-container');
        container.innerHTML = '<div class="loading">⏳ Bejegyzés betöltése...</div>';

        try {
            // 1. Lekérjük a poszt adatait
            const response = await fetch(`https://szig-dujv.hu/wp-json/wp/v2/posts/${postId}?_embed`);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);

            const post = await response.json();

            // 2. Feldolgozzuk a tartalmat
            let title = decodeHtmlEntities(post.title.rendered).trim();
if (title === '') title = '(Cím nélküli bejegyzés)';
            let content = post.content.rendered;
            let date = new Date(post.date);
            let formattedDate = date.toLocaleDateString('hu-HU', { year: 'numeric', month: 'long', day: 'numeric' });

            // 3. Megjelenítjük a modern dizájnban
            container.innerHTML = `
				<a href="/szig" class="back-link">← Vissza a hírekhez</a>
                <div class="post-header">
                    <h1 class="post-title">${escapeHtml(title)}</h1>
                    <span class="post-meta">📅 Közzétéve: ${formattedDate}</span>
                </div>
                <div class="post-content">
                    ${content}
                </div>
            `;

        } catch (error) {
            console.error('Hiba a betöltéskor:', error);
            container.innerHTML = `<div class="error">❌ Hiba történt a bejegyzés betöltésekor: ${error.message}</div>`;
        }
    }

    loadPost();
</script>
<my-footer></my-footer>
</body>
</html>
